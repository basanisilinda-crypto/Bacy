plugins {
    id 'com.android.application'
}
def supabaseUrl = System.getenv('BACY_SUPABASE_URL') ?: ''
def supabaseKey = System.getenv('BACY_SUPABASE_ANON_KEY') ?: ''
def asJavaString = { String v -> '"' + v.replace('\\','\\\\').replace('"','\\"') + '"' }
android {
    namespace 'za.co.mdmtest'
    compileSdk 35
    defaultConfig {
        applicationId 'za.co.mdmtest'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        buildConfigField 'String', 'SUPABASE_URL', asJavaString(supabaseUrl)
        buildConfigField 'String', 'SUPABASE_ANON_KEY', asJavaString(supabaseKey)
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
