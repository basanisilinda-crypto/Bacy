name: MBMF LOOP Android 15 Device Owner QR Pilot

on:
  push:
    branches:
      - mbmf-loop-android15-qr-pilot-20261104
    paths:
      - '.github/workflows/mbmf-loop-android15-qr-pilot.yml'
      - 'locked-phone-management/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mbmf-loop-android15-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-publish-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test finance engine and compile both real Android apps
        working-directory: locked-phone-management
        run: gradle :core:testDebugUnitTest :customer:assembleDebug :admin:assembleDebug --no-daemon --stacktrace

      - name: Verify signatures, package identity and provisioning components
        shell: bash
        run: |
          set -euo pipefail
          for APK in locked-phone-management/{customer,admin}/build/outputs/apk/debug/*-debug.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
            unzip -t "$APK" >/dev/null
          done
          APK="locked-phone-management/customer/build/outputs/apk/debug/customer-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='za.co.bacyflex.customer'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > /tmp/mbmf-client-manifest.txt
          grep -F "FinanceAdminReceiver" /tmp/mbmf-client-manifest.txt
          grep -F "ProvisioningModeActivity" /tmp/mbmf-client-manifest.txt
          grep -F "PolicyComplianceActivity" /tmp/mbmf-client-manifest.txt

      - name: Generate QR from the exact APK and its immutable release URL
        shell: bash
        run: |
          set -euo pipefail
          TAG="mbmf-loop-android15-pilot-${GITHUB_SHA:0:12}"
          DIST="locked-phone-management/pilot-dist"
          mkdir -p "$DIST"
          cp locked-phone-management/customer/build/outputs/apk/debug/customer-debug.apk "$DIST/MBMF-Client-Android15-Pilot.apk"
          cp locked-phone-management/admin/build/outputs/apk/debug/admin-debug.apk "$DIST/MBMF-Admin-Android15-Pilot.apk"
          python -m pip install --disable-pip-version-check 'qrcode[pil]==8.2'
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/MBMF-Client-Android15-Pilot.apk"
          python locked-phone-management/tools/make_enrollment_qr.py \
            --apk "$DIST/MBMF-Client-Android15-Pilot.apk" --url "$URL" --output "$DIST"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_URL=https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_ENV"
          cat > "$DIST/READ-ME-FIRST.txt" <<'EOF'
          MBMF / LOOP ANDROID 15 - DEVICE OWNER PROVISIONING PILOT
          ------------------------------------------------------
          Only use on a spare, wiped phone you own or are authorized to manage.
          This is a debug-signed TEST build and is NOT a commercial-ready MDM.
          Confirm the financing consent and policies before provisioning.
          On the initial Android Welcome screen, tap the same spot six times,
          connect to Wi-Fi, then scan enrollment-qr.png displayed on another device.
          The QR fetches the exactly hashed HTTPS APK; Android checks its SHA-256.
          If Android refuses to enroll, record the actual error; do not bypass it.
          Verify device ownership using ADB and test all policies individually.
          Do not restrict emergency communication or access to payment/support.
          Avoid enrolling a customer or a phone with irreplaceable data.
          The debug signing key changes across CI builds; reinstall/update
          compatibility is NOT guaranteed, and resetting may be necessary.
          Remote lock/unlock, permanent settlement release, EFT verification,
          OEM resistance to firmware flashing, and real-hardware tests are
          not verified by APK compilation or this QR publication.
          EOF

      - name: Publish test release with APKs and setup QR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" locked-phone-management/pilot-dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "MBMF LOOP Android 15 QR Pilot (${GITHUB_SHA:0:7})" \
            --notes "TEST ONLY. Two real, debug-signed Android APKs, provisioning QR and exact APK checksum. Not suitable for financed customer deployment or unverified restriction policies."

      - name: Prove public APK bytes match generated QR payload
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/MBMF-Client-Android15-Pilot.apk"
          curl -fsSL --retry 8 --retry-delay 4 --retry-all-errors --connect-timeout 15 --max-time 160 "$URL" -o /tmp/mbmf-downloaded.apk
          cmp /tmp/mbmf-downloaded.apk locked-phone-management/pilot-dist/MBMF-Client-Android15-Pilot.apk
          python - <<'PY'
          import base64, hashlib, json, pathlib
          dist = pathlib.Path("locked-phone-management/pilot-dist")
          payload = json.loads((dist / "enrollment-qr.json").read_text())
          expected = base64.urlsafe_b64encode(hashlib.sha256(
              (dist / "MBMF-Client-Android15-Pilot.apk").read_bytes()).digest()
          ).decode().rstrip("=")
          assert payload["android.app.extra.PROVISIONING_DEVICE_ADMIN_PACKAGE_CHECKSUM"] == expected
          assert payload["android.app.extra.PROVISIONING_DEVICE_ADMIN_COMPONENT_NAME"] == "za.co.bacyflex.customer/.FinanceAdminReceiver"
          print("Verified exact APK checksum, provisioning receiver and public download byte parity.")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: MBMF-LOOP-Android15-QR-Pilot
          path: locked-phone-management/pilot-dist/*
          if-no-files-found: error
          retention-days: 30
