name: Locked Phone Android APKs
on:
  push:
    paths:
      - 'locked-phone-management/**'
      - '.github/workflows/locked-phone-android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: locked-phone-management
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | head -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :customer:assembleDebug :admin:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: locked-phone-debug-apks
          path: |
            locked-phone-management/customer/build/outputs/apk/debug/*.apk
            locked-phone-management/admin/build/outputs/apk/debug/*.apk
          if-no-files-found: error
