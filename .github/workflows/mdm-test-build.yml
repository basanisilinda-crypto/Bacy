name: Build BACY FLEX Android apps
on:
  push:
    branches:
      - bacy-flex-native-redesign-20261103
    paths:
      - 'mdm-test-android/**'
      - '.github/workflows/mdm-test-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mdm-test-android
    env:
      BACY_SUPABASE_URL: ${{ secrets.BACY_SUPABASE_URL }}
      BACY_SUPABASE_ANON_KEY: ${{ secrets.BACY_SUPABASE_ANON_KEY }}
    steps:
      - name: Check out Android source
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile native customer and admin APKs
        run: gradle --no-daemon --stacktrace :app:assembleDebug :admin:assembleDebug
      - name: Upload customer APK
        uses: actions/upload-artifact@v4
        with:
          name: BACY-FLEX-Customer-APK
          path: mdm-test-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload administrator APK
        uses: actions/upload-artifact@v4
        with:
          name: BACY-FLEX-Admin-APK
          path: mdm-test-android/admin/build/outputs/apk/debug/admin-debug.apk
          if-no-files-found: error
          retention-days: 7
