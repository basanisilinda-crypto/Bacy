name: MBMF Native Android PR Validation
on:
  push:
    branches: [mbmf-native-setup-wizard-20261103]
    paths:
      - 'locked-phone-management/**'
      - '.github/workflows/mbmf-pr-check.yml'
  pull_request:
    paths:
      - 'locked-phone-management/**'
      - '.github/workflows/mbmf-pr-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test finance engine and build native APKs
        working-directory: locked-phone-management
        run: gradle :core:testDebugUnitTest :customer:assembleDebug :admin:assembleDebug --no-daemon --stacktrace
      - name: Validate APKs
        shell: bash
        run: |
          set -euo pipefail
          for APK in locked-phone-management/{customer,admin}/build/outputs/apk/debug/*-debug.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
            unzip -t "$APK" >/dev/null
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mbmf-unreleased-debug-apks
          path: |
            locked-phone-management/customer/build/outputs/apk/debug/*-debug.apk
            locked-phone-management/admin/build/outputs/apk/debug/*-debug.apk
          retention-days: 14
